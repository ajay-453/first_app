<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Landing Page</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;text-align:center;padding:80px 20px}
header h1{font-size:3rem;margin-bottom:15px}
header p{font-size:1.2rem}
.btn{display:inline-block;margin-top:25px;padding:12px 24px;background:white;color:#4f46e5;text-decoration:none;border-radius:8px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:50px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
footer{text-align:center;padding:25px;background:#111827;color:white;margin-top:40px}
</style>
</head>
<body>
<header>
<h1>Welcome to My Website</h1>
<p>A fully self-contained HTML + CSS webpage.</p>
<a href="#" class="btn">Get Started</a>
</header>
<section class="container">
<div class="cards">
<div class="card"><h3>Fast</h3><p>Lightweight design with no external dependencies.</p></div>
<div class="card"><h3>Responsive</h3><p>Works on desktop, tablet, and mobile devices.</p></div>
<div class="card"><h3>Modern</h3><p>Clean layout with a contemporary visual style.</p></div>
</div>
</section>
<footer>&copy; 2026 My Website. All rights reserved.</footer>
</body>
</html>
