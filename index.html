
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3P Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;text-align:center;padding:60px 20px}
.container{max-width:1000px;margin:auto;padding:30px 20px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
button{padding:12px 20px;margin-top:10px;border:none;border-radius:8px;cursor:pointer}
.card{background:white;padding:18px;margin-top:15px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.rank{font-weight:bold;color:#4f46e5}
</style>
</head>
<body>
<header>
<h1>3P Explorer</h1>
<p>Enter a topic and view Top 3 results.</p>
</header>

<div class="container">
<input id="topic" placeholder="programming languages, mutual funds, ucl players">
<button onclick="show3P()">Get 3P</button>
<div id="results"></div>
</div>

<script>
const data = {
"programming languages":[
["#1 Python","AI, data science, automation"],
["#2 JavaScript","Web development"],
["#3 Java","Enterprise systems"]
],
"mutual funds":[
["#1 Parag Parikh Flexi Cap","Long-term consistency"],
["#2 HDFC Flexi Cap","Diversified growth"],
["#3 Motilal Oswal Large & Midcap","Growth potential"]
],
"ucl players":[
["#1 Khvicha Kvaratskhelia","Top performer"],
["#2 Kylian Mbappé","Goalscoring threat"],
["#3 Vitinha","Midfield engine"]
]
};

function show3P(){
 const topic=document.getElementById('topic').value.trim().toLowerCase();
 const results=document.getElementById('results');
 if(!data[topic]){
   results.innerHTML='<div class="card">No data found for: '+topic+'</div>';
   return;
 }
 results.innerHTML=data[topic].map(x =>
   '<div class="card"><div class="rank">'+x[0]+'</div><div>'+x[1]+'</div></div>'
 ).join('');
}
</script>
</body>
</html>
